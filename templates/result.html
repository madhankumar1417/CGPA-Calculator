<!DOCTYPE html>

<html>

<head>

    <title>CGPA Result</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>

<body>

<div class="container">

    <div class="result-page">

        <h1>📊 CGPA Result</h1>


        <div class="student-name">

            {{ student.name }}

        </div>


        <h2>Semester-wise SGPA</h2>


        <table>

            <tr>

                <th>Semester</th>

                <th>Credits</th>

                <th>SGPA</th>

            </tr>


            {% for sem in semester_results %}

            <tr>

                <td>
                    Semester {{ sem.semester }}
                </td>

                <td>
                    {{ sem.credits }}
                </td>

                <td class="sgpa">

                    {{ "%.2f"|format(sem.sgpa) }}

                </td>

            </tr>

            {% endfor %}

        </table>


        <div class="overall-box">

            <p>Overall CGPA</p>

            <div class="cgpa">

                {{ "%.2f"|format(overall_cgpa) }}

            </div>

        </div>


        <div class="result-buttons">

            <a
                href="/"
                class="next-button"
            >
                + Add Next Semester
            </a>


            <a
                href="javascript:history.back()"
                class="back-button"
            >
                ← Back
            </a>

        </div>

    </div>

</div>

</body>

</html>
