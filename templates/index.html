<!DOCTYPE html>

<html>

<head>

    <title>CGPA Calculator</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>

<body>

<div class="container">

    <div class="header">

        <h1>🎓 CGPA Calculator</h1>

        <p>Calculate Semester SGPA and Overall CGPA</p>

    </div>


    <form action="/calculate" method="POST">


        <div class="details">

            <div>

                <label>Student Name</label>

                <input
                    type="text"
                    name="student_name"
                    value="{{ student_name }}"
                    placeholder="Enter student name"
                    required
                >

            </div>


            <div>

                <label>Semester</label>

                <input
                    type="number"
                    name="semester"
                    min="1"
                    placeholder="Example: 1"
                    required
                >

            </div>

        </div>


        <div class="type-box">

            <h3>Calculation Type</h3>

            <label class="radio">

                <input
                    type="radio"
                    name="calculation_type"
                    value="grade"
                    checked
                    onclick="showGrade()"
                >

                Grade

            </label>


            <label class="radio">

                <input
                    type="radio"
                    name="calculation_type"
                    value="marks"
                    onclick="showMarks()"
                >

                Marks

            </label>

        </div>


        <h2>Subjects</h2>


        <div id="subjects">

            <div class="subject">

                <input
                    type="text"
                    name="subject_name"
                    placeholder="Subject Name"
                    required
                >


                <input
                    type="number"
                    name="credits"
                    placeholder="Credits"
                    min="1"
                    step="0.5"
                    required
                >


                <select
                    name="grade"
                    class="grade-input"
                >

                    <option value="S">S</option>
                    <option value="A+">A+</option>
                    <option value="A">A</option>
                    <option value="B+">B+</option>
                    <option value="B">B</option>
                    <option value="C+">C+</option>
                    <option value="C">C</option>

                </select>


                <input
                    type="number"
                    name="marks"
                    class="marks-input"
                    placeholder="Marks / 100"
                    min="0"
                    max="100"
                    step="0.01"
                    style="display:none;"
                >


                <button
                    type="button"
                    class="remove-btn"
                    onclick="removeSubject(this)"
                >
                    Remove
                </button>

            </div>

        </div>


        <div class="buttons">

            <button
                type="button"
                class="add-btn"
                onclick="addSubject()"
            >
                + Add Subject
            </button>


            <button
                type="submit"
                class="calculate-btn"
            >
                Calculate SGPA
            </button>

        </div>

    </form>

</div>


<script>

function addSubject() {

    let container =
        document.getElementById("subjects");

    let div =
        document.createElement("div");

    div.className = "subject";

    div.innerHTML = `

        <input
            type="text"
            name="subject_name"
            placeholder="Subject Name"
            required
        >

        <input
            type="number"
            name="credits"
            placeholder="Credits"
            min="1"
            step="0.5"
            required
        >

        <select
            name="grade"
            class="grade-input"
        >

            <option value="S">S</option>
            <option value="A+">A+</option>
            <option value="A">A</option>
            <option value="B+">B+</option>
            <option value="B">B</option>
            <option value="C+">C+</option>
            <option value="C">C</option>

        </select>

        <input
            type="number"
            name="marks"
            class="marks-input"
            placeholder="Marks / 100"
            min="0"
            max="100"
            step="0.01"
            style="display:none;"
        >

        <button
            type="button"
            class="remove-btn"
            onclick="removeSubject(this)"
        >
            Remove
        </button>

    `;

    container.appendChild(div);

    updateInputType();
}


function removeSubject(button) {

    button.parentElement.remove();

}


function showGrade() {

    document
        .querySelectorAll(".grade-input")
        .forEach(function(input) {

            input.style.display = "block";
            input.required = true;

        });


    document
        .querySelectorAll(".marks-input")
        .forEach(function(input) {

            input.style.display = "none";
            input.required = false;

        });

}


function showMarks() {

    document
        .querySelectorAll(".grade-input")
        .forEach(function(input) {

            input.style.display = "none";
            input.required = false;

        });


    document
        .querySelectorAll(".marks-input")
        .forEach(function(input) {

            input.style.display = "block";
            input.required = true;

        });

}


function updateInputType() {

    let type =
        document.querySelector(
            'input[name="calculation_type"]:checked'
        ).value;

    if (type === "grade") {

        showGrade();

    } else {

        showMarks();

    }

}

</script>

</body>

</html>
